            <h2>關於我</h2>

            <p style="text-indent:2em">
               我是一個中年宅的軟體工程師，一家三口居住在台灣北部，資訊工程的本科系碩士，目前已經在某國立大學的人文社會學院工作了十幾年，協助進行各種研究。
               興趣廣泛，也可說是極度地不務正業，比起研究AI技術，更關心AI革命帶來的社會衝擊，以及下一代人面對AI應有的個人修為。
